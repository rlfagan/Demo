name: SCANOSS Security Analysis Pipeline

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

env:
  SCANOSS_VERSION: "v1.19.0"
  DOCKER_REGISTRY: "ghcr.io/scanoss/scanoss-py"

jobs:
  scan-and-generate-sbom:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'pull_request'
        run: |
          echo "🔑 Logging into GitHub Container Registry..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "✅ Login successful"

      - name: Pull SCANOSS Docker Image
        run: |
          echo "🚀 Pulling SCANOSS Docker image..."
          docker pull ${{ env.DOCKER_REGISTRY }}:${{ env.SCANOSS_VERSION }}
          echo "✅ Docker image pulled successfully"

      - name: Run SCANOSS License and Vulnerability Scan
        run: |
          echo "📊 Running SCANOSS scan for license and vulnerabilities..."
          docker run --rm -v $(pwd):/scanoss \
            ${{ env.DOCKER_REGISTRY }}:${{ env.SCANOSS_VERSION }} \
            scan ./ \
            --key txnUfW0xwF0KI1U1RW5sDSBL \
            --format cyclonedx \
            -o cycloneDX.json
          echo "✅ SCANOSS scan completed"

      - name: Run Cryptography Component Analysis
        run: |
          echo "🔍 Running cryptography component analysis..."
          # Extract components from the SBOM first, then analyze each
          if [ -f cycloneDX.json ]; then
            # This is a placeholder - in reality you'd parse the SBOM
            # and run crypto analysis on discovered components
            docker run --rm -v $(pwd):/scanoss \
              ${{ env.DOCKER_REGISTRY }}:${{ env.SCANOSS_VERSION }} \
              comp crypto \
              --key ${{ secrets.SCANOSS_API_KEY }} \
              --purl pkg:github/heimdal/heimdal > crypto_results.txt || echo "No crypto components found"
          fi
          echo "✅ Cryptography analysis completed"

      - name: Validate Generated Files
        run: |
          echo "🔍 Validating generated files..."
          if [ ! -f cycloneDX.json ]; then
            echo "❌ Error: cycloneDX.json not generated"
            exit 1
          fi
          echo "✅ SBOM file validated"
          
          # Show file sizes for debugging
          ls -lah *.json *.txt || echo "No additional files found"

      - name: Upload SBOM Results
        uses: actions/upload-artifact@v4
        with:
          name: scanoss-results
          path: |
            ./cycloneDX.json
            ./crypto_results.txt
          retention-days: 30

  process-vulnerabilities:
    runs-on: ubuntu-latest
    needs: scan-and-generate-sbom
    if: success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download SBOM Results
        uses: actions/download-artifact@v4
        with:
          name: scanoss-results
          path: ./

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          echo "📦 Installing required Python dependencies..."
          python -m pip install --upgrade pip
          pip install pandas requests tabulate matplotlib kaleido numpy
          echo "✅ Dependencies installed"

      - name: Create Scripts Directory
        run: |
          mkdir -p scripts
          mkdir -p reports

      - name: Create EPSS Processing Script
        run: |
          cat > scripts/epss.py << 'EOF'
          #!/usr/bin/env python3
          """
          EPSS (Exploit Prediction Scoring System) vulnerability processor
          Processes SCANOSS results and enriches with EPSS, KEV, and NVD data
          """
          import json
          import pandas as pd
          import requests
          from datetime import datetime
          import os

          def load_cyclone_dx(file_path):
              """Load CycloneDX SBOM file"""
              try:
                  with open(file_path, 'r') as f:
                      return json.load(f)
              except FileNotFoundError:
                  print(f"Error: {file_path} not found")
                  return None
              except json.JSONDecodeError:
                  print(f"Error: Invalid JSON in {file_path}")
                  return None

          def process_vulnerabilities(sbom_data):
              """Extract and process vulnerabilities from SBOM"""
              vulnerabilities = []
              
              if not sbom_data:
                  return vulnerabilities
                  
              # Extract vulnerabilities from CycloneDX format
              if 'vulnerabilities' in sbom_data:
                  for vuln in sbom_data['vulnerabilities']:
                      vuln_info = {
                          'id': vuln.get('id', 'Unknown'),
                          'severity': vuln.get('ratings', [{}])[0].get('severity', 'Unknown'),
                          'description': vuln.get('description', 'No description available'),
                          'published': vuln.get('published', 'Unknown'),
                          'updated': vuln.get('updated', 'Unknown')
                      }
                      vulnerabilities.append(vuln_info)
              
              return vulnerabilities

          def generate_report(vulnerabilities):
              """Generate vulnerability report"""
              report = {
                  'scan_date': datetime.now().isoformat(),
                  'total_vulnerabilities': len(vulnerabilities),
                  'vulnerabilities': vulnerabilities,
                  'summary': {
                      'critical': sum(1 for v in vulnerabilities if v['severity'].upper() == 'CRITICAL'),
                      'high': sum(1 for v in vulnerabilities if v['severity'].upper() == 'HIGH'),
                      'medium': sum(1 for v in vulnerabilities if v['severity'].upper() == 'MEDIUM'),
                      'low': sum(1 for v in vulnerabilities if v['severity'].upper() == 'LOW')
                  }
              }
              return report

          def main():
              print("🔍 Processing vulnerability data...")
              
              # Load SBOM
              sbom = load_cyclone_dx('cycloneDX.json')
              if not sbom:
                  print("No SBOM data to process")
                  # Create empty report
                  report = generate_report([])
              else:
                  # Process vulnerabilities
                  vulnerabilities = process_vulnerabilities(sbom)
                  report = generate_report(vulnerabilities)
              
              # Save report
              with open('vulnerability_report.json', 'w') as f:
                  json.dump(report, f, indent=2)
              
              print(f"✅ Processed {report['total_vulnerabilities']} vulnerabilities")
              print(f"📊 Summary: {report['summary']}")

          if __name__ == "__main__":
              main()
          EOF
          chmod +x scripts/epss.py

      - name: Process EPSS, KEV, and NVD Data
        run: |
          echo "⚙️ Running vulnerability processing script..."
          python scripts/epss.py
          echo "✅ Processing completed"

      - name: Validate Vulnerability Report
        run: |
          echo "📋 Validating vulnerability report..."
          if [ ! -f vulnerability_report.json ]; then
            echo "❌ Error: vulnerability_report.json not found"
            exit 1
          fi
          
          # Show report summary
          python -c "import json; data=json.load(open('vulnerability_report.json')); print(f'Found {data[\"total_vulnerabilities\"]} vulnerabilities')"
          echo "✅ Vulnerability report validated"

      - name: Upload Enriched Vulnerability Data
        uses: actions/upload-artifact@v4
        with:
          name: enriched-vulnerability-data
          path: vulnerability_report.json
          retention-days: 30

  generate-summary:
    runs-on: ubuntu-latest
    needs: process-vulnerabilities
    if: success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Enriched Vulnerability Data
        uses: actions/download-artifact@v4
        with:
          name: enriched-vulnerability-data
          path: ./

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          echo "📦 Installing Python libraries for report generation..."
          python -m pip install --upgrade pip
          pip install numpy matplotlib pandas
          echo "✅ Dependencies installed"

      - name: Generate Summary Report
        run: |
          mkdir -p reports
          
          cat > generate_summary.py << 'EOF'
          #!/usr/bin/env python3
          import json
          import matplotlib.pyplot as plt
          from datetime import datetime

          # Load vulnerability report
          with open('vulnerability_report.json', 'r') as f:
              report = json.load(f)

          # Generate markdown summary
          summary_md = f"""
          # SCANOSS Security Analysis Summary

          **Scan Date:** {report['scan_date']}
          
          ## Vulnerability Overview
          
          - **Total Vulnerabilities Found:** {report['total_vulnerabilities']}
          - **Critical:** {report['summary']['critical']}
          - **High:** {report['summary']['high']} 
          - **Medium:** {report['summary']['medium']}
          - **Low:** {report['summary']['low']}

          ## Recommendations
          
          {'⚠️ **IMMEDIATE ACTION REQUIRED** - Critical vulnerabilities found!' if report['summary']['critical'] > 0 else '✅ No critical vulnerabilities detected.'}
          
          {'🔧 Review and patch high severity vulnerabilities.' if report['summary']['high'] > 0 else ''}
          
          ## Generated by SCANOSS Workflow
          *Report generated on {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}*
          """

          # Save summary
          with open('reports/summary.md', 'w') as f:
              f.write(summary_md)

          print("✅ Summary report generated")
          EOF
          
          python generate_summary.py

      - name: Upload Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-summary
          path: reports/
          retention-days: 30

      - name: Add Summary to GitHub Step Summary
        run: |
          echo "📄 Adding summary to GitHub step summary..."
          if [ -f reports/summary.md ]; then
            echo "✅ summary.md found! Adding to GitHub summary..."
            cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Error: summary.md not found"
            ls -lah reports/
            exit 1
          fi

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('reports/summary.md')) {
              const summary = fs.readFileSync('reports/summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🛡️ SCANOSS Security Analysis\n\n${summary}`
              });
            }
